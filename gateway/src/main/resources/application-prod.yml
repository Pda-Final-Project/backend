spring:
  application:
    name: gateway
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  web:
    cors:
      enabled: false
  cloud:
    gateway:
      routes:
        - id: stock-stream
          uri: http://data-service.backend.svc.cluster.local:8080
          predicates:
            - Path=/v1/api/stocks/stream/**
          filters:
            - name: SetResponseHeader
              args:
                name: Connection
                value: keep-alive
            - name: SetResponseHeader
              args:
                name: Cache-Control
                value: no-store, no-cache, must-revalidate
            - name: SetResponseHeader
              args:
                name: X-Accel-Buffering
                value: no
            - name: SetResponseHeader
              args:
                name: Content-Type
                value: text/event-stream;charset=UTF-8
            - name: RemoveResponseHeader
              args:
                name: Transfer-Encoding

        - id: trade-stream
          uri: http://execution-service.backend.svc.cluster.local:8080
          predicates:
            - Path=/v1/api/trades/stream/**
          filters:
            - name: SetResponseHeader
              args:
                name: Connection
                value: keep-alive
            - name: SetResponseHeader
              args:
                name: Cache-Control
                value: no-store, no-cache, must-revalidate
            - name: SetResponseHeader
              args:
                name: X-Accel-Buffering
                value: no
            - name: SetResponseHeader
              args:
                name: Content-Type
                value: text/event-stream;charset=UTF-8
            - name: RemoveResponseHeader
              args:
                name: Transfer-Encoding

        - id: sse-stream
          uri: http://user-service.backend.svc.cluster.local:8080
          predicates:
            - Path=/v1/api/sse/**
          filters:
            - name: SetResponseHeader
              args:
                name: Connection
                value: keep-alive
            - name: SetResponseHeader
              args:
                name: Cache-Control
                value: no-store, no-cache, must-revalidate
            - name: SetResponseHeader
              args:
                name: X-Accel-Buffering
                value: no
            - name: SetResponseHeader
              args:
                name: Content-Type
                value: text/event-stream;charset=UTF-8
            - name: RemoveResponseHeader
              args:
                name: Transfer-Encoding

        - id: user-service
          uri: http://user-service.backend.svc.cluster.local:8080
          predicates:
            - Path=/v1/api/notification/**, /v1/api/auth/**, /v1/api/holdingStocks/**, /v1/api/pinnedStocks/**, /v1/api/holdings/**, /v1/api/tradeProfit/**, /v1/api/transactions/**, /v1/api/account/**, /v1/api/balance/**

        - id: order-service
          uri: http://order-service.backend.svc.cluster.local:8080
          predicates:
            - Path=/v1/api/order/**

        - id: execution-service
          uri: http://execution-service.backend.svc.cluster.local:8080
          predicates:
            - Path=/v1/api/execution/**, /v1/api/trades/**

        - id: filling-service
          uri: http://filling-service.backend.svc.cluster.local:8080
          predicates:
            - Path=/v1/api/fillings/**

        - id: data-service
          uri: http://data-service.backend.svc.cluster.local:8080
          predicates:
            - Path=/v1/api/news/**, /v1/api/stocks/**, /v1/api/exchange-rate/**, /v1/api/earnings/**, /v1/api/chart/**

      discovery:
        locator:
          enabled: true

      httpclient:
        response-timeout: 600000  # 10분 동안 SSE 요청 유지

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, httpexchanges
  endpoint:
    health:
      show-details: ALWAYS

jwt:
  secret: "greenlemonTgreenlemonTgreenlemonTgreenlemonTgreenlemonTgreenlemonTgreenlemonTgreenlemonT"
  expiration: 86400000

common:
  redis:
    enabled: false
  kafka:
    enabled: false
  discovery:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

  cloud:
    discovery:
      enabled: false

logging:
  level:
    org.springframework.cloud.gateway: trace
    reactor.netty: trace
