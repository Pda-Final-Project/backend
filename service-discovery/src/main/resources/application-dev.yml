spring:
  application:
    name: service-discovery

server:
  port: 19090
  address: 0.0.0.0

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

  server:
    enable-self-preservation: false  # 자기 보호 모드 비활성화 (선택)
    eviction-interval-timer-in-ms: 60000  # 정리 주기 (선택)
    wait-time-in-ms-when-sync-empty: 0  # 동기화 대기 시간 제거
    peer-node-read-timeout-ms: 200  # Eureka 클러스터가 없으므로 timeout 최소화
    peer-eureka-nodes-update-interval-ms: 600000  # 동기화 시도 간격 (크게 설정)
  instance:
    hostname: localhost

