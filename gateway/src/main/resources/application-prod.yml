spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  application:
    name: gateway

  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Content-Type
              - Authorization
            allowCredentials: true
      routes:
        - id: user-service
          uri: http://user-service.backend.svc.cluster.local:8080
          predicates:
            - Path= /v1/api/users/**, /v1/api/sse/**, /v1/api/notification/**, /v1/api/auth/**, /v1/api/holdingStocks/**, /v1/api/pinnedStocks/**, /v1/api/holdings/**, /v1/api/tradeProfit/**, /v1/api/transactions/**, /v1/api/account/**, /v1/api/balance/**

        - id: order-service
          uri: http://order-service.backend.svc.cluster.local:8080
          predicates:
            - Path=/v1/api/order/**

        - id: execution-service
          uri: http://execution-service.backend.svc.cluster.local:8080
          predicates:
            - Path=/v1/api/execution/**, /v1/api/trades/**

        - id: filling-service
          uri: http://filling-service.backend.svc.cluster.local:8080
          predicates:
            - Path=/v1/api/fillings/**

        - id: data-service
          uri: http://data-service.backend.svc.cluster.local:8080
          predicates:
            - Path=/v1/api/news/**, /v1/api/stocks/**, /v1/api/exchange-rate/**, /v1/api/earnings/**, /v1/api/chart/**

      discovery:
        locator:
          enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, httpexchanges
  endpoint:
    health:
      show-details: ALWAYS
jwt:
  secret: "greenlemonTgreenlemonTgreenlemonTgreenlemonTgreenlemonTgreenlemonTgreenlemonT"
  expiration: 86400000

common:
  redis:
    enabled: false
  kafka:
    enabled: false
  discovery:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

  cloud:
    discovery:
      enabled: false

logging:
  level:
    org.springframework.cloud.gateway: trace
    reactor.netty: trace