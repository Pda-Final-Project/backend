spring:
  application:
    name: filling-service

  datasource:
    url: jdbc:mysql:replication://fillingdb-router.db.svc.cluster.local:6446,6447/finpagodb
    username: root
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
    properties:
      useSSL: false
      characterEncoding: UTF-8
      readOnlyPropagatesToServer: true
  jpa:
    database: mysql
    generate-ddl: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false

common:
  redis:
    enabled: false
  kafka:
    enabled: false
  discovery:
    enabled: false


eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

  cloud:
    discovery:
      enabled: false
