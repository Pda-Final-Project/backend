spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  main:
    allow-bean-definition-overriding: true
    web-application-type: reactive

  application:
    name: gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service.backend.svc.cluster.local:8080
          predicates:
            - Path=/api/users/**, /api/auth/**, /api/stocks/**, /api/likes/**

        - id: order-service
          uri: http://order-service.backend.svc.cluster.local:8080
          predicates:
            - Path=/api/order/**

        - id: execution-service
          uri: http://execution-service.backend.svc.cluster.local:8080
          predicates:
            - Path=/api/execution/**

        - id: notification-service
          uri: http://notification-service.backend.svc.cluster.local:8080
          predicates:
            - Path=/api/notification/**

        - id: filling-service
          uri: http://filling-service.backend.svc.cluster.local:8080
          predicates:
            - Path=/api/filling/**, /api/news/**

      discovery:
        locator:
          enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, httpexchanges
  endpoint:
    health:
      show-details: ALWAYS
jwt:
  secret: "greenlemonTgreenlemonTgreenlemonTgreenlemonTgreenlemonTgreenlemonTgreenlemonT"
  expiration: 86400000

common:
  redis:
    enabled: false
  kafka:
    enabled: false
  discovery:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

  cloud:
    discovery:
      enabled: false

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.server: DEBUG