server:
  port: 19091
  address: 0.0.0.0

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:19090/eureka


#  instance:
#    instance-id: ${spring.application.name}:${server.port}
#    prefer-ip-address: true

spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:19092/
          predicates:
            - Path=/v1/api/auth/**, /v1/api/account/**,/v1/api/holdings/**,/v1/api/tradeProfit/**,/v1/api/holdingStocks/**,/v1/api/balance/**,/v1/api/notification/**,/v1/api/sse/**,/v1/api/pinnedStocks/**

        - id: order-service
          uri: http://localhost:19093/
          predicates:
            - Path=/v1/api/order/**

        - id: execution-service
          uri: http://localhost:19095/
          predicates:
            - Path=/v1/api/execution/**,/v1/api/trades/**

        - id: filling-service
          uri: lb://filling-service
          predicates:
            - Path=/v1/api/filling/**

        - id: data-service
          uri: http://localhost:19099/
          predicates:
            - Path=/v1/api/news/**,/v1/api/chart/**,/v1/api/stocks/**,/v1/api/earnings/**,/v1/api/exchange-rate/**

      discovery:
        locator:
          enabled: true

jwt:
  secret: "greenlemonTgreenlemonTgreenlemonTgreenlemonTgreenlemonTgreenlemonTgreenlemonT"
  expiration: 86400000

common:
  discovery:
    enabled: true